[package]
name = "lefsim-py"
description = "Python bindings for lefsim (pyo3); built and published as the lefsim wheel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_lefsim"
crate-type = ["cdylib"]
# Tested from Python (pytest); a Rust test binary can't link an extension module.
test = false
doctest = false

[dependencies]
lefsim = { workspace = true, features = ["serde"] }
pyo3 = { version = "0.29", features = ["abi3-py39"] }
# No buffer_protocol: we only export, and it would need abi3-py311.
pyo3-arrow = { version = "0.19", default-features = false }
# Must match pyo3-arrow's arrow major version.
arrow-array = "60"
arrow-buffer = "60"
arrow-schema = "60"
arrow-cast = { version = "60", default-features = false }
serde_json.workspace = true
serde.workspace = true
# serde <-> Python objects; must match the pyo3 version.
pythonize = "0.29"
