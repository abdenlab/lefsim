[package]
name = "lefsim-py"
version.workspace = true
edition.workspace = true
publish = false

[lib]
name = "_lefsim"
crate-type = ["cdylib"]
# Tested from Python (pytest); a Rust test binary can't link an extension module.
test = false
doctest = false

[dependencies]
lefsim = { workspace = true, features = ["serde"] }
pyo3 = { version = "0.29", features = ["abi3-py39"] }
# No buffer_protocol: we only export, and it would need abi3-py311.
pyo3-arrow = { version = "0.19", default-features = false }
# Must match pyo3-arrow's arrow major version.
arrow-array = "59"
arrow-buffer = "59"
arrow-schema = "59"
arrow-cast = { version = "59", default-features = false }
serde_json.workspace = true
serde.workspace = true
