# The documentation site, built with Zensical (https://zensical.org) from
# the Markdown in docs/. Preview with `uvx zensical serve`.

[project]
site_name = "lefsim"
site_description = "Stochastic simulation of loop-extrusion factors on a 1D lattice"
site_url = "https://abdenlab.github.io/lefsim/"
repo_url = "https://github.com/abdenlab/lefsim"
edit_uri = "edit/main/docs/"
nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Concepts" = [
    { "The framework" = "concepts/framework.md" },
    { "The LEF model" = "concepts/model.md" },
    { "Recording and replay" = "concepts/recording.md" },
    { "Effective distance" = "concepts/effective-distance.md" },
  ] },
  { "Guides" = [
    { "Rust" = "guides/rust.md" },
    { "Python" = "guides/python.md" },
    { "TypeScript" = "guides/typescript.md" },
    { "Browser demos" = "guides/demos.md" },
  ] },
  { "Design notes" = "design/vision.md" },
  { "API reference" = "reference.md" },
]
extra_css = ["stylesheets/extra.css"]

[project.theme]
language = "en"
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
features = [
  "content.code.copy",
  "content.tabs.link", # one language tab choice applies across the page
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
