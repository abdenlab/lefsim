# The documentation site, built with Zensical (https://zensical.org) from
# the Markdown in docs/. Preview with `uvx zensical serve`.

[project]
site_name = "lefsim"
site_description = "Stochastic simulation of loop-extrusion factors on a 1D lattice"
site_url = "https://abdenlab.github.io/lefsim/"
repo_url = "https://github.com/abdenlab/lefsim"
edit_uri = "edit/main/docs/"
nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Concepts" = [
    { "The framework" = "concepts/framework.md" },
    { "The LEF model" = "concepts/model.md" },
    { "Recording and replay" = "concepts/recording.md" },
    { "Effective distance" = "concepts/effective-distance.md" },
  ] },
  { "Guides" = [
    { "Rust" = "guides/rust.md" },
    { "Python" = "guides/python.md" },
    { "TypeScript" = "guides/typescript.md" },
    { "Browser demos" = "guides/demos.md" },
  ] },
  { "Design notes" = "design/vision.md" },
  { "API reference" = [
    "reference/index.md",
    { "Python" = "reference/python.md" },
    # Generated by TypeDoc (pnpm docs:api), not committed.
    { "TypeScript" = [
      "reference/typescript/index.md",
      { "lefsim" = "reference/typescript/lefsim.md" },
      { "lefsim/arrow" = "reference/typescript/lefsim/arrow.md" },
      { "lefsim/parquet" = "reference/typescript/lefsim/parquet.md" },
    ] },
  ] },
]
extra_css = ["stylesheets/extra.css"]

[project.theme]
language = "en"
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
features = [
  "content.code.copy",
  "content.tabs.link", # one language tab choice applies across the page
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
# The page outline stops at level 4: in the API reference, members, not
# their parameter and return sections.
toc.toc_depth = 4
pymdownx.details = {}
pymdownx.highlight = {}
pymdownx.superfences = {}
# Include files in pages, e.g. the model schema (paths from the repo root).
pymdownx.snippets.check_paths = true
pymdownx.tabbed.alternate_style = true

# The Python API reference, rendered from the type stubs (python/lefsim), whose
# docstrings scripts/sync_stub_docs.py copies from the Rust bindings. Read
# statically, so building the docs doesn't need the compiled extension.
[project.plugins.mkdocstrings.handlers.python]
paths = ["python"]

[project.plugins.mkdocstrings.handlers.python.options]
allow_inspection = false
docstring_style = "google"
heading_level = 3
show_root_heading = true
show_root_full_path = false
show_symbol_type_heading = true
show_symbol_type_toc = true
members_order = "source"
merge_init_into_class = true
filters = ["!^_"]
separate_signature = true
show_signature_annotations = true
signature_crossrefs = true
show_source = false
