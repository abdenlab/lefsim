# Weekly dependency update PRs, one grouped PR per ecosystem to keep the
# noise down. CI runs on each PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]

  # The pnpm workspace (packages/*), from the root lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]

  # The Python dev environment (python/uv.lock).
  - package-ecosystem: uv
    directory: /python
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
