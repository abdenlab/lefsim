# Build the browser demos and deploy them to Cloudflare
# (https://lefsim.abdenlab.org) whenever main changes them or what they use.
# Needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: Demo

on:
  push:
    branches: [main]
    paths:
      - "packages/demo/**"
      - "packages/lefsim/**"
      - "crates/**"
      - "Cargo.lock"
      - "pnpm-lock.yaml"
      - ".github/workflows/demo.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:wasm
      # The Parquet page's sample recording is too big for a static asset
      # (25 MiB at most), so it's hosted elsewhere: the DEMO_SAMPLE_URL
      # repository variable. Without it, the page offers no sample.
      - run: pnpm --filter demo build
        env:
          VITE_SAMPLE_URL: ${{ vars.DEMO_SAMPLE_URL }}
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/demo
          # The demo package's own wrangler (a pnpm dev dependency, so it's
          # locked); pnpm-lock.yaml is at the root, so say which manager.
          packageManager: pnpm
          command: deploy
