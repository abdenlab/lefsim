# Tests for all three packages and the docs. Runs on pushes and pull requests,
# and is called by the release workflow before anything is published.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Versions agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-version.sh

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # The whole workspace, so the bindings are linted too.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test -p lefsim --all-features
      - run: cargo doc -p lefsim --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo publish -p lefsim --dry-run

  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.2.0
      # The dev group only: the notebook stack isn't needed here.
      - run: uv sync --locked --python 3.13 --no-default-groups --group dev
      - run: uv run --no-sync pytest tests
      # ruff, over all the repo's Python, once.
      - if: runner.os == 'Linux'
        run: |
          uv run --no-sync ruff check --config pyproject.toml ..
          uv run --no-sync ruff format --check --config pyproject.toml ..

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm build:wasm
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter demo build
      # Pack the npm package as it would be published, and use it from a
      # clean project in plain Node.
      - name: Pack and import the npm package
        run: |
          pnpm --dir packages/lefsim pack --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          echo '{ "type": "module" }' > package.json
          npm install --no-save ./lefsim-*.tgz
          cat > smoke.mjs <<'JS'
          import { readFile } from "node:fs/promises";
          import { fileURLToPath } from "node:url";
          import { createLattice, createModel, init, populate, Sim } from "lefsim";
          await init(await readFile(fileURLToPath(import.meta.resolve("lefsim/lefsim_wasm_bg.wasm"))));
          const sim = new Sim(createModel(populate(createLattice(1000, []), 10, { seed: 1 })), { seed: 1 });
          sim.runUntil(100);
          if (sim.time !== 100) throw new Error(`time ${sim.time}`);
          console.log("ok");
          JS
          node smoke.mjs

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The TypeScript API reference (TypeDoc) reads types from the wasm build.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:wasm
      - run: pnpm docs:api
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uvx --with mkdocstrings-python zensical build --strict
      - run: >-
          uvx --with mdformat-mkdocs --with mdformat-tables mdformat --wrap 80 --exclude 'docs/reference/typescript/**' --check
          docs/ README.md AGENTS.md CHANGELOG.md crates/lefsim/README.md python/README.md packages/lefsim/README.md
