# Publish all three packages from a version tag (see "Releasing" in the
# README). Everything is built and tested before anything is published; the
# three publish jobs then run independently, each through trusted publishing
# (OIDC), so the repository holds no registry tokens.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    name: Tag matches the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-version.sh "$GITHUB_REF_NAME"
      - id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true"; else echo "prerelease=false"; fi >> "$GITHUB_OUTPUT"

  test:
    needs: check
    uses: ./.github/workflows/ci.yml

  # ---------------------------------------------------------------- builds

  wheels:
    name: Wheel (${{ matrix.name }})
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Wheels built on a runner of their own architecture are installed
          # and tested there; that also checks the golden hash per platform.
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: auto, test: true }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: auto, test: true }
          - { name: musllinux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { name: musllinux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          - { name: macos-arm64, runner: macos-latest, target: aarch64, test: true }
          - { name: macos-x86_64, runner: macos-latest, target: x86_64 }
          - { name: windows-x64, runner: windows-latest, target: x64, test: true }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - name: Test the wheel
        if: matrix.test
        shell: bash
        run: |
          python -m pip install python/dist/*.whl pytest pyarrow polars duckdb pandas numpy
          # From outside python/, so the installed wheel is imported, not the source tree.
          cd "$RUNNER_TEMP" && python -m pytest "$GITHUB_WORKSPACE/python/tests"
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.name }}
          path: python/dist/*.whl

  sdist:
    name: Python sdist
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: python/dist/*.tar.gz

  npm-pack:
    name: npm tarball
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:wasm
      - run: pnpm --filter lefsim pack --pack-destination "$GITHUB_WORKSPACE/npm-dist"
      - uses: actions/upload-artifact@v7
        with:
          name: npm
          path: npm-dist/*.tgz

  # ---------------------------------------------------------------- publish

  # Each publish job skips a registry that already has this version (from a
  # first release published by hand, or a re-run after a partial failure).

  crates-io:
    name: Publish to crates.io
    needs: [check, test, wheels, sdist, npm-pack]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
    steps:
      - id: published
        run: |
          if curl -sfA "lefsim release (github.com/abdenlab/lefsim)" "https://crates.io/api/v1/crates/lefsim/$VERSION" > /dev/null; then
            echo "lefsim $VERSION is already on crates.io"; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          VERSION: ${{ needs.check.outputs.version }}
      - if: steps.published.outputs.skip != 'true'
        uses: actions/checkout@v7
      - if: steps.published.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.published.outputs.skip != 'true'
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - if: steps.published.outputs.skip != 'true'
        run: cargo publish -p lefsim
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  pypi:
    name: Publish to PyPI
    needs: [test, wheels, sdist, npm-pack]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: "{wheel-*,sdist}"
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  npm:
    name: Publish to npm
    needs: [check, test, wheels, sdist, npm-pack]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm
          path: npm-dist
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - id: published
        run: |
          if npm view "lefsim@$VERSION" version > /dev/null 2>&1; then
            echo "lefsim $VERSION is already on npm"; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          VERSION: ${{ needs.check.outputs.version }}
      # Pre-releases go to the "next" dist-tag, so `npm install lefsim` keeps
      # getting the latest stable release.
      - if: steps.published.outputs.skip != 'true'
        run: npm publish npm-dist/*.tgz --access public --tag ${{ needs.check.outputs.prerelease == 'true' && 'next' || 'latest' }}

  github-release:
    name: GitHub release
    needs: [check, crates-io, pypi, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          scripts/changelog-section.sh "$VERSION" > notes.md
          flags=()
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" assets/* --title "$GITHUB_REF_NAME" --notes-file notes.md "${flags[@]}"
