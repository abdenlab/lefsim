[workspace]
resolver = "3"
members = ["crates/*"]
# Keep bare `cargo build` / `cargo test` on the core crate. Binding crates
# (cdylibs) may need toolchains that aren't installed.
default-members = ["crates/lefsim"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
lefsim = { path = "crates/lefsim" }
slotmap = "1"
smallvec = "1"
rand = { version = "0.8", default-features = false }
rand_pcg = { version = "0.3", default-features = false }
