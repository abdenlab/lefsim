[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "lefsim"
description = "Stochastic simulation of loop-extrusion factors on a 1D lattice"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nezar Abdennur" }]
keywords = ["loop extrusion", "chromatin", "cohesin", "simulation", "gillespie"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.9"
# Read from the Cargo workspace, so the wheel always matches the crate.
dynamic = ["version"]
# No runtime dependencies: output is Arrow data exposed through the Arrow
# PyCapsule Interface, readable by pyarrow, polars, duckdb, etc.
dependencies = []

[dependency-groups]
dev = ["pytest", "pyarrow>=15", "polars>=1.3", "duckdb>=1.1", "pandas", "numpy", "jsonschema", "ruff"]
notebook = ["jupyter", "matplotlib"]

[project.urls]
Documentation = "https://abdenlab.github.io/lefsim/"
Repository = "https://github.com/abdenlab/lefsim"

[tool.uv]
# `uv sync` and `uv run` install everything, so running one never removes
# what another needs.
default-groups = "all"
# Rebuild the extension when the Rust code changes, not just this file.
cache-keys = [
  { file = "pyproject.toml" },
  { file = "../Cargo.toml" },
  { file = "../Cargo.lock" },
  { file = "../crates/lefsim/**/*.rs" },
  { file = "../crates/lefsim/Cargo.toml" },
  { file = "../crates/lefsim-py/**/*.rs" },
  { file = "../crates/lefsim-py/Cargo.toml" },
]

[tool.maturin]
# The pyo3 bindings live with the other Rust crates; this directory is the
# Python package (lefsim/) and its tests.
manifest-path = "../crates/lefsim-py/Cargo.toml"
python-source = "."
module-name = "lefsim._lefsim"
# Bytecode written while developing in place doesn't belong in a wheel.
exclude = ["lefsim/__pycache__/**"]
features = ["pyo3/extension-module"]

# Lint and format settings for all the repo's Python, including the scripts
# in packages/ and docs/: the Makefile passes --config python/pyproject.toml.
[tool.ruff]
line-length = 120
# The oldest Python the wheel supports (requires-python above).
target-version = "py39"
# The tour notebook's cells are edited by hand, and mdformat owns Markdown
# (ruff would reformat its code examples, aligned comments and all).
extend-exclude = ["*.ipynb", "*.md"]

[tool.ruff.lint]
# Listed explicitly, so a ruff upgrade doesn't change the rules: pyflakes,
# pycodestyle's error checks and sorted imports.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["lefsim"]
